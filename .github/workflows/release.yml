name: Release

# Fires when a version tag is pushed, e.g. `git tag v0.1.0 && git push --tags`.
# The build job always runs and uploads the sdist+wheel as artifacts, so it is
# useful even before any package index is wired up. The publish job uses PyPI
# trusted publishing (OIDC) — no API token is stored in the repo — and is inert
# until a matching "pending publisher" is configured on TestPyPI for this
# repository + workflow, so merely adding this file cannot publish anything.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      is-prerelease: ${{ steps.tag.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify tag matches pyproject version
        id: tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')"
          echo "tag=$tag  pyproject=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match pyproject version $proj"
            exit 1
          fi
          # PEP 440 pre-release suffixes. A pre-release goes to TestPyPI only, so
          # `v0.11.0rc1` exercises the whole pipeline without spending a version
          # number on PyPI, where they can never be reused or deleted.
          if printf '%s' "$tag" | grep -qE '(a|b|rc)[0-9]+$'; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
            echo "$tag is a pre-release: TestPyPI only"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
            echo "$tag is a final release: TestPyPI and PyPI"
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing needs this permission and a GitHub environment that the
    # TestPyPI project is configured to trust.
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI carries this name from a private pre-public version scheme,
          # up to 0.1.11.0. Every release number below that is already taken, so
          # the upload is refused with "400 File already exists" -- as it was for
          # v0.1.1, which existed there from 2026-01-27. That failure says
          # nothing about the build and must not redden a release whose PyPI
          # upload succeeded, so a collision here is tolerated. It stays fatal on
          # PyPI, where a duplicate would mean something has genuinely gone wrong.
          skip-existing: true

  # Final releases only. Inert until a "pending publisher" for this repository
  # and workflow is configured on pypi.org and a `pypi` environment exists here,
  # so merely having this job cannot publish anything.
  publish-pypi:
    needs: build
    if: needs.build.outputs.is-prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Publishes the tag on the repository's Releases page, with the matching
  # CHANGELOG section as the body and the built artifacts attached. Without
  # this, tags exist but Releases does not list them, so the repository shows no
  # version history and "Watch -> Releases" notifies nobody.
  #
  # `gh` is preinstalled on the runner and authenticates with the built-in
  # token, so this adds no third-party action to the release path and needs no
  # `id-token` permission -- only `contents: write` to create the release.
  #
  # The result checks rather than a plain `needs:` are deliberate. A Release
  # must not announce a version whose upload failed, but `publish-pypi` is
  # *skipped* for a pre-release tag, and a skipped dependency would skip this
  # job too. `always()` re-enables it so the two outcomes can be told apart.
  github-release:
    needs: [build, publish-pypi]
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.build.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG section for this version: everything between its
          # heading and the next one. A pre-release usually has no section of
          # its own, so fall back to generated notes rather than an empty body.
          awk -v v="$version" '
            $0 ~ "^### \\["v"\\]" { found = 1; next }
            found && /^### \[/    { exit }
            found                 { print }
          ' CHANGELOG.md > notes.md
          flags=()
          if [ -s notes.md ]; then
            flags+=(--notes-file notes.md)
            echo "Using the CHANGELOG section for $version"
          else
            flags+=(--generate-notes)
            echo "::warning::No CHANGELOG section for $version; using generated notes"
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl \
            --title "structboost $version" "${flags[@]}"
